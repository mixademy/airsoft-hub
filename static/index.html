<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airsoft Hub | A Legjobb Ajánlatok</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="theme-toggle" class="theme-btn">🌙 Sötét mód</button>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="container">
        <header class="glass-header">
            <h1>Airsoft Hub</h1>
            <p>Airsoftguru • Airsoftplaza • Taiwangun • Gunfire • Catus • Airsoftpro • Combatzone • Anareus</p>
        </header>

        <main>
            <section class="category-section">
                <h2>⭐ Legnépszerűbb Termékek</h2>
                <div class="product-grid" id="legnepszerubb-container"></div>
            </section>

            <section class="category-section">
                <h2>🔥 Éppen Akciós Termékek</h2>
                <div class="product-grid" id="akcios-container"></div>
            </section>

            <section class="category-section">
                <h2>🎯 Kezdő Fegyverek és Szettek</h2>
                <div class="product-grid" id="kezdo-container"></div>
            </section>
            
            <section class="category-section">
                <h2>🔫 Pisztolyok és Karabélyok</h2>
                <div class="product-grid" id="fegyverek-container"></div>
            </section>

            <section class="category-section">
                <h2>🛠️ AAP-01 Kiegészítők</h2>
                <div class="product-grid" id="aap01-container"></div>
            </section>

            <section class="category-section">
                <h2>🪖 Ruházat és Felszerelés</h2>
                <div class="product-grid" id="ruhazat-container"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
