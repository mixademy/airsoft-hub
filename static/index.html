<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airsoft Hub | A Felszerelésed Itt Kezdődik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Felszerelés Építő Modál -->
    <div id="builder-modal" class="modal-overlay hidden">
        <div class="modal-content builder-content glass-card">
            <button id="close-builder" class="close-btn">✖</button>
            <h2 style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem;">🛠️ Felszerelés Építő</h2>
            <div class="builder-list"></div>
            <div style="margin-top: 2rem; text-align: right;">
                <button class="btn btn-large" onclick="alert('Felszerelés mentve!')">Felszerelés Mentése</button>
            </div>
        </div>
    </div>

    <!-- Termékválasztó Al-modál API Keresővel és Szűrőkkel -->
    <div id="picker-modal" class="modal-overlay hidden" style="z-index: 1001;">
        <div class="modal-content picker-content glass-card">
            <button id="close-picker" class="close-btn">✖</button>
            <h3 id="picker-title" style="margin-bottom: 1rem;">Válassz terméket</h3>
            
            <div class="search-wrapper" style="margin-bottom: 1.5rem; width: 100%; max-width: 100%;">
                <div class="search-bar" style="margin: 0; flex-grow: 1;">
                    <input type="text" id="picker-search-input" placeholder="Élő keresés a webshopokban...">
                </div>
                <button id="picker-filter-toggle" class="filter-btn">⚙️ Szűrők</button>
                
                <div id="picker-filter-panel" class="filter-panel hidden">
                    <select id="picker-shop-filter" class="glass-select">
                        <option value="">Minden Webshop</option>
                        <option value="taiwangun">Taiwangun</option>
                        <option value="gunfire">Gunfire</option>
                        <option value="airsoftplaza">Airsoftplaza</option>
                    </select>
                    <select id="picker-cat-filter" class="glass-select">
                        <option value="">Minden Kategória</option>
                        <option value="rifle">Karabély (Rifle)</option>
                        <option value="pistol">Pisztoly</option>
                        <option value="sniper">Mesterlövész</option>
                        <option value="shotgun">Shotgun</option>
                        <option value="gear">Felszerelés</option>
                        <option value="gas">Gáz / Akku</option>
                    </select>
                </div>
            </div>

            <div class="picker-grid" id="picker-grid"></div>
        </div>
    </div>

    <!-- Fő Navigáció -->
    <nav class="main-nav">
        <div class="nav-logo" style="display: flex; align-items: center; gap: 0.5rem;">
            <img src="img/logo.svg" alt="Logo" style="width: 30px; height: 30px; display: none;" onerror="this.style.display='none'">
            AIRSOFT<span>HUB</span>
        </div>
        
        <div class="search-wrapper">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Keresés a webshopokban...">
            </div>
            <button id="main-filter-toggle" class="filter-btn" title="Szűrők">⚙️</button>
            
            <div id="main-filter-panel" class="filter-panel hidden">
                <select id="main-shop-filter" class="glass-select">
                    <option value="">Minden Webshop</option>
                    <option value="taiwangun">Taiwangun</option>
                    <option value="gunfire">Gunfire</option>
                    <option value="airsoftplaza">Airsoftplaza</option>
                </select>
                <select id="main-cat-filter" class="glass-select">
                    <option value="">Minden Kategória</option>
                    <option value="rifle">Karabély (Rifle)</option>
                    <option value="pistol">Pisztoly</option>
                    <option value="sniper">Mesterlövész</option>
                    <option value="shotgun">Shotgun</option>
                    <option value="gear">Felszerelés</option>
                    <option value="gas">Gáz / Akku</option>
                </select>
            </div>
        </div>

        <button id="mobile-menu-toggle" class="mobile-only theme-icon">☰</button>

        <div class="nav-links" id="nav-links">
            <a href="#akcios-sec">Akciók</a>
            <a href="#legnepszerubb-sec">Legnépszerűbb</a>
            <a href="#kezdo-sec">Kezdőknek</a>
            <a href="#pisztoly-sec">Pisztolyok</a>
            <a href="#karabely-sec">Karabélyok</a>
        </div>

        <div class="nav-icons">
            <button id="builder-toggle" class="theme-icon" title="Felszerelés Építő">🔨</button>
            <button id="theme-toggle" class="theme-icon" title="Téma váltás">☀️</button>
        </div>
    </nav>

    <div class="container">
        <header class="hero-section">
            <h1>A Felszerelésed Itt Kezdődik</h1>
            <p>Valós idejű válogatás a legnagyobb európai webáruházakból.</p>
        </header>

        <main>
            <section id="search-results-sec" class="category-section hidden">
                <h2>🔎 Keresési Találatok</h2>
                <div class="product-grid" id="search-results-container"></div>
            </section>
            
            <section id="legnepszerubb-sec" class="category-section">
                <h2>⭐ Legnépszerűbb Termékek</h2>
                <div class="product-grid" id="legnepszerubb-container"></div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
